# Production Compose file pulling pre-built images from GitHub Container Registry (GHCR)
# Replace <YOUR_GITHUB_USERNAME_LOWERCASE> with your GitHub username or organization name.

services:
  backend:
    image: ghcr.io/${GHCR_OWNER:-sanasaaga}/backend:latest
    # Server-side secret for the daily challenge. Must be provided by the
    # deployment environment (runner env / .env). The backend refuses to start
    # a daily game if it is unset.
    environment:
      - DAILY_WORD_SECRET=${DAILY_WORD_SECRET:-}
    restart: unless-stopped
    volumes:
      - pb_data:/pb/pb_data
    networks:
      - sanasaaga-net

  frontend:
    image: ghcr.io/${GHCR_OWNER:-sanasaaga}/frontend:latest
    restart: unless-stopped
    ports:
      - "8000:80"
    depends_on:
      - backend
    networks:
      - sanasaaga-net

volumes:
  pb_data:

networks:
  sanasaaga-net:
    driver: bridge
