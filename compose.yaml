services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    volumes:
      - pb_data:/pb/pb_data
    networks:
      - sanakuutio-net

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8000:80"
    depends_on:
      - backend
    networks:
      - sanakuutio-net

volumes:
  pb_data:

networks:
  sanakuutio-net:
